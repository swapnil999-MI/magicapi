openapi: 3.0.3
info:
  title: MagicAPI Demo API
  version: 1.0.0
  description: High-performance API documented with MagicAPI with full OpenAPI 3.0 support.
  termsOfService: https://example.com/terms
  contact:
    name: MagicAPI Team
    email: support@magicapi.dev
    url: https://magicapi.dev/contact
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
externalDocs:
  description: OpenAPI 3.0 Documentation Specification
  url: https://spec.openapis.org/oas/v3.0.3
servers:
- url: http://localhost:8000/api/v1
  description: Local Development Server
  variables:
    env:
      default: local
      description: Target deployment environment
- url: https://api.example.com/v1
  description: Production Server
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    OAuth2Auth:
      type: oauth2
      description: OAuth2 authorization code flow
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example.com/authorize
          tokenUrl: https://auth.example.com/token
          scopes:
            read:users: Read user profile
            write:users: Modify user data
paths:
  /auth/login:
    post:
      tags:
      - Authentication
      summary: User Authentication Login
      description: Authenticates user credentials and returns session tokens.
      x-created-at: '2026-08-15T09:00:00Z'
      x-updated-at: '2026-08-20T10:00:00Z'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  example: admin@example.com
                password:
                  type: string
                  format: password
                  example: SecretPassword123!
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                    example: 3600
  /auth/logout:
    post:
      tags:
      - Authentication
      summary: Logout Session
      description: Invalidate the current session token.
      x-created-at: '2026-08-15T09:00:00Z'
      x-updated-at: '2026-08-20T10:00:00Z'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Logged out successfully
  /users:
    get:
      tags:
      - Users
      summary: List All Users
      description: Retrieves a paginated list of system users.
      x-created-at: '2026-08-31T12:00:00Z'
      x-updated-at: '2026-08-31T18:00:00Z'
      security:
      - BearerAuth: []
      parameters:
      - name: page
        in: query
        description: Page number
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        description: Items per page
        schema:
          type: integer
          default: 10
      - name: status
        in: query
        description: Filter by status
        schema:
          type: string
          enum:
          - active
          - pending
          - suspended
          default: active
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: usr_12345
                        name:
                          type: string
                          example: Jane Doe
                        email:
                          type: string
                          example: jane@example.com
    post:
      tags:
      - Users
      summary: Create New User
      description: Registers a new user in the platform.
      x-created-at: '2026-08-31T14:30:00Z'
      x-updated-at: '2026-08-31T18:30:00Z'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - email
              properties:
                name:
                  type: string
                  example: Jane Doe
                email:
                  type: string
                  example: jane@example.com
                role:
                  type: string
                  enum:
                  - admin
                  - member
                  - viewer
                  default: member
      responses:
        '201':
          description: User created successfully
  /users/{id}:
    summary: Single User Management
    description: Operations on a specific user record
    parameters:
    - name: id
      in: path
      required: true
      description: Unique user ID
      schema:
        type: string
        example: usr_12345
    get:
      tags:
      - Users
      summary: Get User by ID
      description: Fetch details of an existing user.
      x-created-at: '2026-08-20T10:00:00Z'
      x-updated-at: '2026-08-25T11:00:00Z'
      responses:
        '200':
          description: User details
    delete:
      tags:
      - Users
      summary: Delete User
      description: Remove user account.
      responses:
        '204':
          description: User deleted
    options:
      tags:
      - Users
      summary: User Resource Options
      description: Return allowed HTTP methods for user resource.
      responses:
        '200':
          description: CORS Options response
