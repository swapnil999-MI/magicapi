server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index docs.html index.html;

    # Enable Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/x-yaml text/yaml;

    # CORS configuration
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
    add_header Access-Control-Allow-Headers "*";

    # Documentation Portal
    location /docs {
        alias /usr/share/nginx/html/docs.html;
        default_type text/html;
    }

    # Interactive API Studio
    location /api {
        alias /usr/share/nginx/html/index.html;
        default_type text/html;
    }

    # OpenAPI Specifications
    location /docs/openapi.yaml {
        alias /usr/share/nginx/html/openapi.yaml;
        default_type application/x-yaml;
    }

    location /docs/openapi.json {
        alias /usr/share/nginx/html/openapi.json;
        default_type application/json;
    }

    # Default fallback
    location / {
        try_files $uri $uri/ /docs.html;
    }
}
